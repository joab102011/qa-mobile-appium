# =============================================================================
# GitHub Actions — ATIVO (pipeline hibrida)
# =============================================================================
# Camadas:
#   1) verificar_projeto — sempre (npm ci + APK + configs; SEM criar AVD)
#   2) smoke / regressao BrowserStack — so com secrets BROWSERSTACK_*
#
# Evidencia dos 10 cenarios E2E: emulador local WdioDemo_API34 porta 5560
#   npm run emulador:iniciar && npm run testar:android:local
# Espelho GitLab: .gitlab-ci.yml
# =============================================================================

name: CI Mobile Appium

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar_projeto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Gate de integridade (APK + configs WDIO)
        run: npm run verificar:ci
        env:
          UDID_ANDROID: emulator-5560

  smoke_android_browserstack:
    needs: [verificar_projeto]
    if: ${{ secrets.BROWSERSTACK_USERNAME != '' && secrets.BROWSERSTACK_ACCESS_KEY != '' && secrets.BROWSERSTACK_APP_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Instalar deps e baixar APK (sem criar AVD no runner)
        run: |
          npm ci
          node scripts/baixar-app.js
      - name: Smoke (@smoke) no BrowserStack
        run: npm run testar:android:bs:smoke
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BROWSERSTACK_APP_ID: ${{ secrets.BROWSERSTACK_APP_ID }}
      - name: Artefatos smoke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-mobile-smoke
          path: |
            allure-results/
            capturas/
          retention-days: 7

  testar_android_browserstack:
    needs: [smoke_android_browserstack]
    if: ${{ secrets.BROWSERSTACK_USERNAME != '' && secrets.BROWSERSTACK_ACCESS_KEY != '' && secrets.BROWSERSTACK_APP_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Instalar deps e baixar APK (sem criar AVD no runner)
        run: |
          npm ci
          node scripts/baixar-app.js
      - name: Regressao Android no BrowserStack
        run: npm run testar:android:bs
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BROWSERSTACK_APP_ID: ${{ secrets.BROWSERSTACK_APP_ID }}
      - name: Publicar artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-mobile
          path: |
            allure-results/
            capturas/
          retention-days: 7
