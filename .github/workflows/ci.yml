# =============================================================================
# GitHub Actions — INATIVO por padrao
# =============================================================================
# Pipeline auto-suficiente: setup-node 20 + npm run preparar + BrowserStack.
# Sem Android Studio, sem emulador no runner. Secrets: BROWSERSTACK_*.
# Espelho: .gitlab-ci.yml | Ativar: descomentar push/PR e remover if: false.
# =============================================================================

name: CI Mobile Appium

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

jobs:
  testar_android_browserstack:
    if: false # CI inativo — remova esta linha ao ativar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Preparar projeto (deps + APK)
        run: npm run preparar
      - name: Executar suite Android no BrowserStack
        run: npm run testar:android:bs
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BROWSERSTACK_APP_ID: ${{ secrets.BROWSERSTACK_APP_ID }}
      - name: Publicar artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-mobile
          path: |
            allure-results/
            capturas/
          retention-days: 7
