# =============================================================================
# GitHub Actions — ATIVO (pipeline hibrida)
# =============================================================================
# Camadas:
#   1) verificar_projeto — sempre: npm run verificar:ci (APK + app iOS + configs; SEM AVD)
#   2) smoke / regressao BrowserStack — steps so com secrets BROWSERSTACK_*
#
# E2E local (fora do runner):
#   Android: npm run emulador:iniciar && npm run testar:android:local
#   iOS Mac: open -a Simulator && npm run testar:ios:local
# Comandos: docs/COMANDOS.md | Racional: docs/PLANEJAMENTO.md
# Espelho GitLab: .gitlab-ci.yml
# =============================================================================

name: CI Mobile Appium

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar_projeto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Gate de integridade (APK + configs WDIO)
        run: npm run verificar:ci
        env:
          UDID_ANDROID: emulator-5560

  smoke_android_browserstack:
    needs: [verificar_projeto]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detectar credenciais BrowserStack
        id: bs
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BROWSERSTACK_APP_ID: ${{ secrets.BROWSERSTACK_APP_ID }}
        run: |
          if [ -n "$BROWSERSTACK_USERNAME" ] && [ -n "$BROWSERSTACK_ACCESS_KEY" ] && [ -n "$BROWSERSTACK_APP_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "BrowserStack ausente — smoke na nuvem ignorado (esperado sem secrets)."
          fi
      - uses: actions/setup-node@v4
        if: steps.bs.outputs.enabled == 'true'
        with:
          node-version: "20"
          cache: npm
      - name: Instalar deps e baixar APK (sem criar AVD no runner)
        if: steps.bs.outputs.enabled == 'true'
        run: |
          npm ci
          node scripts/baixar-app.js
      - name: Smoke (@smoke) no BrowserStack
        if: steps.bs.outputs.enabled == 'true'
        run: npm run testar:android:bs:smoke
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BROWSERSTACK_APP_ID: ${{ secrets.BROWSERSTACK_APP_ID }}
      - name: Artefatos smoke
        if: always() && steps.bs.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-mobile-smoke
          path: |
            allure-results/
            capturas/
          retention-days: 7

  testar_android_browserstack:
    needs: [smoke_android_browserstack]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detectar credenciais BrowserStack
        id: bs
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BROWSERSTACK_APP_ID: ${{ secrets.BROWSERSTACK_APP_ID }}
        run: |
          if [ -n "$BROWSERSTACK_USERNAME" ] && [ -n "$BROWSERSTACK_ACCESS_KEY" ] && [ -n "$BROWSERSTACK_APP_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "BrowserStack ausente — regressao na nuvem ignorada (esperado sem secrets)."
          fi
      - uses: actions/setup-node@v4
        if: steps.bs.outputs.enabled == 'true'
        with:
          node-version: "20"
          cache: npm
      - name: Instalar deps e baixar APK (sem criar AVD no runner)
        if: steps.bs.outputs.enabled == 'true'
        run: |
          npm ci
          node scripts/baixar-app.js
      - name: Regressao Android no BrowserStack
        if: steps.bs.outputs.enabled == 'true'
        run: npm run testar:android:bs
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BROWSERSTACK_APP_ID: ${{ secrets.BROWSERSTACK_APP_ID }}
      - name: Publicar artefatos
        if: always() && steps.bs.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-mobile
          path: |
            allure-results/
            capturas/
          retention-days: 7
