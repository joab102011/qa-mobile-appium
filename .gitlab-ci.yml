# =============================================================================
# GitLab CI — INATIVO por padrao
# =============================================================================
# Pipeline espelhada no GitHub Actions (.github/workflows/ci.yml).
# Nao cria pipeline automatica. Job oficial: BrowserStack (secrets no projeto).
# Emulador no runner SaaS e pesado — execucao local: npm run testar:android:local
# Para ativar: altere workflow.rules. Detalhes: README.md (Estrategia de CI).
# =============================================================================

workflow:
  rules:
    - when: never # CI inativo — troque por rules de branch/MR ao ativar

stages:
  - testar

testar_android_browserstack:
  image: node:20
  stage: testar
  script:
    - npm ci
    - npm run testar:android:bs
  artifacts:
    when: always
    paths:
      - allure-results/
      - capturas/
    expire_in: 7 days
  rules:
    - if: $BROWSERSTACK_USERNAME
      when: on_success
    - when: manual
      allow_failure: true
