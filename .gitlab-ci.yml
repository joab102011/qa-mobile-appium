# =============================================================================
# GitLab CI — ATIVO (pipeline hibrida; espelho do GitHub Actions)
# =============================================================================
# Camadas:
#   1) verificar_projeto — sempre (sem criar AVD)
#   2) smoke / regressao BrowserStack — so com BROWSERSTACK_USERNAME
#
# Local: npm run emulador:iniciar && npm run testar:android:local
# Espelho GitHub: .github/workflows/ci.yml
# =============================================================================

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - verificar
  - smoke
  - testar

verificar_projeto:
  image: node:20
  stage: verificar
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
    UDID_ANDROID: "emulator-5560"
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/
      - node_modules/
  before_script:
    - npm ci
  script:
    - npm run verificar:ci

smoke_android_browserstack:
  image: node:20
  stage: smoke
  needs: ["verificar_projeto"]
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/
      - node_modules/
  before_script:
    - npm ci
    - node scripts/baixar-app.js
  script:
    - npm run testar:android:bs:smoke
  artifacts:
    when: always
    paths:
      - allure-results/
      - capturas/
    expire_in: 7 days
  rules:
    - if: $BROWSERSTACK_USERNAME && $BROWSERSTACK_ACCESS_KEY && $BROWSERSTACK_APP_ID
      when: on_success
    - when: never

testar_android_browserstack:
  image: node:20
  stage: testar
  needs: ["smoke_android_browserstack"]
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/
      - node_modules/
  before_script:
    - node -v && npm -v
    - npm ci
    - node scripts/baixar-app.js
  script:
    - npm run testar:android:bs
  artifacts:
    when: always
    paths:
      - allure-results/
      - capturas/
    expire_in: 7 days
  rules:
    - if: $BROWSERSTACK_USERNAME && $BROWSERSTACK_ACCESS_KEY && $BROWSERSTACK_APP_ID
      when: on_success
    - when: never
