# =============================================================================
# GitLab CI — INATIVO por padrao
# =============================================================================
# Pipeline auto-suficiente: imagem Node 20 + npm run preparar + BrowserStack.
# Sem Android Studio, sem emulador no runner. Secrets: BROWSERSTACK_*.
# Espelho: .github/workflows/ci.yml | Ativar: trocar workflow.rules (README).
# =============================================================================

workflow:
  rules:
    - when: never # CI inativo — troque por rules de branch/MR ao ativar

stages:
  - testar

testar_android_browserstack:
  image: node:20
  stage: testar
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/
      - node_modules/
  before_script:
    - node -v && npm -v
    - npm run preparar
  script:
    - npm run testar:android:bs
  artifacts:
    when: always
    paths:
      - allure-results/
      - capturas/
    expire_in: 7 days
  rules:
    - if: $BROWSERSTACK_USERNAME
      when: on_success
    - when: manual
      allow_failure: true
